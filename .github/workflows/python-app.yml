name: Python CI

# Trigger the workflow on any push or pull request
on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main    
            
jobs:
    test:
        runs-on: ubuntu-latest  # jobs run on container this coudld be any other coutainer like windows,mac container. Here we use ubuntu 
                                # Github will take allcode and will run on this container
        
        steps:
            # Step 1 Check out the code from repository
            - name: Check out code
              uses: actions/checkout@v2

            # Step 2 Set up Python enviromnent
            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.8'
              
            # Step 3 Install Dependencies
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            # Step 4 Run Test 
            - name: Run tests
              run: | 
                export PYTHONPATH=.
                pytest  

